<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>

<title>AI Cost Watch (interactive)</title>
<style>
  html[data-theme="light"] {
    --fill: #1a365d;
    --fill-fg: #f8fafc;
    --bg: #f8fafc;
    --bg-card: #ffffff;
    --navy: #1a365d;
    --slate: #4a5568;
    --body: #2d3748;
    --alt: #f1f5f9;
    --line: #cbd5e1;
    --good: #15803d;
    --goodbg: #f0fdf4;
    --bad: #b91c1c;
    --badbg: #fef2f2;
    --accent: #2563eb;
    --amber: #b45309;
    --amberbg: #fffbeb;
  }
  html[data-theme="dark"] {
    --fill: #1e293b;
    --fill-fg: #f1f5f9;
    --bg: #0b0f19;
    --bg-card: #111827;
    --navy: #ffffff;
    --slate: #94a3b8;
    --body: #f1f5f9;
    --alt: #162032;
    --line: #1e293b;
    --good: #34d399;
    --goodbg: rgba(52,211,153,0.15);
    --bad: #f87171;
    --badbg: rgba(248,113,113,0.15);
    --accent: #38bdf8;
    --amber: #f59e0b;
    --amberbg: rgba(245,158,11,0.15);
  }
  *{box-sizing:border-box}
  body{font-family:Arial,Helvetica,sans-serif;color:var(--body);margin:0;
    background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 22px 64px}
  h1{color:var(--navy);font-size:26px;margin:0 0 4px}
  .sub{color:var(--slate);font-size:14px;margin:0 0 8px;max-width:760px}
  .stamp{color:var(--slate);font-size:12.5px;margin:6px 0 0}
  .stamp a{color:var(--accent);text-decoration:none}
  .stamp a:hover{text-decoration:underline}

  .signal{margin:20px 0 6px;padding:14px 18px;border-radius:8px;
    border:1px solid var(--line);background:var(--alt);display:flex;
    flex-wrap:wrap;gap:6px 18px;align-items:baseline}
  .signal .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--slate);font-weight:bold}
  .signal .val{font-size:16px;font-weight:bold;color:var(--good)}
  .signal .val .dot{display:inline-block;width:9px;height:9px;border-radius:50%;
    background:var(--good);margin-right:7px;vertical-align:middle}
  .signal .note{font-size:13px;color:var(--body);flex:1 1 100%;margin-top:4px}

  .controls{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;
    margin:18px 0 8px;padding:14px 16px;background:var(--alt);
    border:1px solid var(--line);border-radius:8px}
  .ctl label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--slate);font-weight:bold;margin-bottom:6px}
  .seg{display:inline-flex;border:1px solid var(--navy);border-radius:6px;overflow:hidden;flex-wrap:wrap}
  .seg button{appearance:none;border:0;background:#fff;color:var(--navy);
    padding:8px 14px;font-size:13.5px;cursor:pointer;font-family:inherit}
  .seg button+button{border-left:1px solid var(--navy)}
  .seg button.on{background:var(--fill);color:var(--fill-fg);font-weight:bold}
  select{padding:8px 10px;font-size:14px;font-family:inherit;
    border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--body);min-width:260px}

  .card{margin-top:16px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .card .head{padding:14px 18px;background:#fbfdff;border-bottom:1px solid var(--line)}
  .card .head h2{margin:0;color:var(--navy);font-size:18px}
  .card .head .meta{color:var(--slate);font-size:12.5px;margin-top:3px}
  .badge{display:inline-block;padding:2px 9px;border-radius:11px;font-size:11.5px;
    font-weight:bold;margin-left:8px;vertical-align:middle}
  .badge.exp{color:var(--good);background:var(--goodbg)}
  .badge.trig{color:var(--bad);background:var(--badbg)}
  .card .body{padding:16px 18px}
  .thread{font-size:14.5px;color:var(--body);border-left:4px solid var(--navy);
    padding:2px 0 2px 14px;margin:0 0 14px}
  .subh{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);
    font-weight:bold;margin:16px 0 8px}
  ul.dev{margin:0;padding-left:20px}
  ul.dev li{margin:0 0 9px;font-size:13.5px}
  ul.watch{margin:0;padding-left:20px}
  ul.watch li{margin:0 0 6px;font-size:13px;color:var(--slate)}
  .net{margin:14px 0 0;padding:12px 14px;background:var(--alt);border-radius:6px;font-size:13.5px}
  .net b{color:var(--navy)}

  table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
  thead th{background:var(--fill);color:var(--fill-fg);text-align:left;padding:9px 10px;font-size:12.5px}
  tbody td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:nth-child(even){background:var(--alt)}
  td.val{font-weight:bold;color:var(--navy);white-space:nowrap;font-variant-numeric:tabular-nums}
  td.iss{color:var(--slate);white-space:nowrap}
  .foot{margin-top:26px;font-size:12px;color:var(--slate);line-height:1.55}
  .foot b{color:var(--body)}
  .hide{display:none}
  .themebtn{position:fixed;top:14px;right:14px;z-index:99;font:600 11px/1 Arial,Helvetica,sans-serif;
    letter-spacing:.05em;padding:7px 11px;border-radius:5px;cursor:pointer;
    border:1px solid var(--line);background:var(--bg-card,var(--alt));color:var(--slate)}
  .themebtn:hover{border-color:var(--accent);color:var(--accent)}
</style>

<script>
const DATA = {"series": {"title": "AI Cost Watch", "subtitle": "A recurring, dated note on the unit economics of the AI buildout: whether its cost and demand assumptions are holding. Each issue states a falsifiable forward call.", "concept_doi": "10.5281/zenodo.20541643", "orcid": "0009-0003-4213-7769", "author": "NM AI Research", "signal_name": "Hyperscaler capital-expenditure guidance turning down", "signal_note": "The single indicator this series watches. A down-revision in the Big Four's forward capex guide is the trigger. It was first testable at the late-July 2026 Q2 window and did not fire there: all four reported and none conceded a demand-led cut. It has not fired in any issue to date."}, "issues": [{"n": 1, "week": "Week of 2 June 2026", "pub": "4 June 2026", "doi": "10.5281/zenodo.20541644", "status": "EXPANSION", "trigger": false, "thread": "The week stayed bifurcated: spend did not roll over, while the demand and price side kept accumulating deflation evidence and the physical limits hardened into more chokepoints.", "developments": ["Big Four/Five 2026 capex guides sum to roughly $660-725B, at utility-grade intensity on software-grade balance sheets (Meta ~54%, Microsoft ~47%, Alphabet ~46% of revenue).", "Memory is now ~30% of hyperscaler capex (up from ~8% in 2023, SemiAnalysis); the binding constraint has migrated from logic to DRAM/HBM and power.", "Physical chokepoints hardened: gas turbines +195% by 2027 with ~6-year lead times (~110 GW ordered vs 60-70 GW capacity, Wood Mackenzie); PCB/substrate US output down to ~4% of world (from 30% in 2000).", "DeepSeek made its V4 75% price cut permanent: $0.87 per million output tokens, open weights, roughly 1/17th of Claude Opus 4.7 and 1/34th of GPT-5.5.", "MIT NANDA (contested but real): ~95% of enterprise generative-AI deployments show no measurable P&L return. Oracle 5-year CDS spread roughly tripled in H2 2025 on OpenAI concentration.", "The honest other side: revenue is real and growing (Anthropic ~$30B, OpenAI ~$24-25B annualized run-rates); LBNL/DOE sizes datacentre load at 4.4% of US electricity in 2023 and warns forecasts 'consistently overestimate'."], "net_read": "Still expansion; both theses intact; no trigger. The demand/pricing case is slowly accumulating evidence; the physical-constraint case is hardening; the capex line itself has not turned.", "watching": ["The first down-revision in hyperscaler capex guidance at the late-July Q2 reports (the core tell).", "Evidence of enterprises routing routine inference to cheap open models at scale, the demand-side transmission that would precede a capex turn."]}, {"n": 2, "week": "Week of 12 June 2026", "pub": "13 June 2026", "doi": "10.5281/zenodo.20682980", "status": "EXPANSION", "trigger": false, "thread": "The price of using AI was metered upward beneath the spend; a financing mechanism appeared that can hold valuations up regardless of fundamentals; and a government switch pulled a frontier model from the market overnight.", "developments": ["Effectively the entire AI-coding-tool category abandoned flat-rate pricing for metered/credit/quota billing within one window: GitHub Copilot to token-metered AI Credits (agentic use projected 10x-50x), Cursor, Windsurf/Devin, Google Antigravity, and even Anthropic's Claude Code to weekly caps.", "The reconciliation: DeepSeek's 75% per-token cut coexists with coding vendors raising effective prices, because agentic workflows consume tokens super-linearly. Cheaper tokens do not mean cheaper AI: a lower price per token, a higher cost per task.", "Buyers began metering themselves: Walmart capped 'Code Puppy' per-employee tokens; Uber capped $1,500/month per AI coding tool after exhausting its 2026 Claude Code budget in ~4 months; Microsoft cancelled most internal Claude Code licences for its own Copilot CLI.", "Bain Pathfinder (951 respondents): 40% tracking AI spend report under 10% cost savings, yet 90% of underperformers still plan to raise budgets, so the caps throttle spend without yet falsifying the thesis.", "Announced-vs-deliverable now in the planners' own numbers: PJM cut summer-2027 peak ~4 GW and accepted only 34 GW of ~60 GW in 2030 datacentre submissions (43% haircut); Sightline estimates 30-50% of planned 2026 US datacentre capacity delayed or cancelled.", "SpaceX IPO priced 11 June at $135 (~$1.77T), closed +19.2% at $160.95, on accelerated index-inclusion rules (Goldman: up to $60B forced passive buying) against a Morningstar fair value ~55% below. Anthropic filed a confidential draft S-1 on 1 June (Series H: $965B valuation on ~$47B run-rate, ~20.5x sales).", "BIS ordered Anthropic to suspend Fable 5 and Mythos 5 for any foreign national: the first nationality-scoped model suspension, shut off globally, a regulatory lever that can remove a frontier model overnight."], "net_read": "Still expansion; no trigger. But the texture changed: the cost of using AI is being re-priced upward at the coalface even as headline token prices fall, a financing mechanism can hold valuations up independent of fundamentals, and a regulatory lever can pull a model overnight.", "watching": ["The first down-revision in hyperscaler capex guidance (the core tell).", "Evidence that coding-tool metering causes measurable usage pullback.", "Any Anthropic S-1 disclosure of the organic-versus-round-tripped revenue split.", "Further nationality-scoped or export-control actions on model access."]}, {"n": 3, "week": "Week of 24 June 2026", "pub": "25 June 2026", "doi": "10.5281/zenodo.20838747", "status": "EXPANSION", "trigger": false, "thread": "Whether the headline token price reflects the underlying cost at all. The falling per-token price and the rising aggregate bill are both consistent with a list price sitting below delivered cost, supported for now by capital.", "developments": ["Gartner puts 2026 worldwide AI spending at ~$2.59T (~+47% YoY). Apollo's Slok notes a token-expenditure index has roughly doubled since late 2025 even as the per-token price fell ~90% since 2023, the Jevons pattern in two numbers.", "FinOps Foundation 2026: the share of practitioners responsible for managing AI spend rose from ~31% (2025) to ~98% (2026), and ~73% of enterprises found AI costs exceeded original projections.", "The per-token price kept falling, led from the open-weight side: DeepSeek V4-Flash ~$0.14/$0.28 input/output, V4-Pro ~$1.74/$3.48, Mistral Medium 3.5 ~$1.50/$7.50, roughly a 25x spread across tiers.", "Model-routing is now a standard cost lever: RouteLLM (ICLR 2025) reports ~85% cost reduction at ~95% of flagship quality.", "The hardware cost beneath the price moved the other way: Micron fiscal-Q3 revenue ~$41.46B at ~84.6% gross margin, HBM sold out for 2026, filling only ~50-66% of demand. Memory ~30% of hyperscaler capex.", "NVIDIA states its Rubin platform targets a ~10x reduction in inference token cost versus Blackwell, a route by which the floor could fall through engineering rather than a pricing-support unwind."], "net_read": "Still expansion; no trigger. The texture was the widening distance between the published token price and the delivered cost beneath it. The figure to watch remains the gap between price and delivered cost, not the price alone.", "watching": ["The first down-revision in hyperscaler capex guidance (the core tell).", "The first frontier provider to raise inference list prices (the most direct test of the below-cost assessment).", "Whether usage metering produces measurable pullback that converts into a revenue or capex down-revision.", "Delivered evidence of the Rubin efficiency gain in production inference pricing."]}, {"n": 4, "week": "Week of 1 July 2026", "pub": "4 July 2026", "doi": "10.5281/zenodo.21198216", "status": "EXPANSIONARY", "trigger": false, "thread": "Are the efficiency gains that are supposed to lower delivered cost real and large enough to matter? Each claim is genuine but narrower than its headline; efficiency is re-shaping the resource bill, not retiring it.", "developments": ["The Big Four's 2026 capex guides still sum to roughly $725B (up ~77% on 2025), and Microsoft reports an $80B Azure backlog it cannot fill for want of power.", "The price spread widened rather than settling: the frontier runs from ~$10 per million input tokens at the top (Fable 5, which retook the coding lead at 80.3% on SWE-Bench Pro) down to open-weight models free to self-host, a ~100x range.", "Water lever: NVIDIA's warm-water direct-to-chip cooling claims '300x water efficiency', but the figure counts only inside the fence; closed-loop cooling relocates the water demand to the power plant rather than erasing it (US thermoelectric consumed ~3 billion gallons/day in 2015). Lake Powell sits at ~23% of capacity.", "Meta moved to resell its excess AI compute and raised 2026 capex to $125-145B (from $115-135B) citing component prices. Meta rose ~9%; neoclouds CoreWeave and Nebius each fell ~12%: the first hyperscaler admission of excess capacity.", "Custom silicon is where the cost floor is actually moving: Anthropic entered early talks with Samsung for a first custom inference chip (2nm, HBM4), a week after OpenAI's Broadcom-built 'Jalapeno'. Both are announced, not delivered; hyperscaler ASICs (TPU, Trainium, Maia) are already in production.", "The 'price cut' that is an added tier: GPT-5.6 holds the Sol flagship at $5/$30 (identical to GPT-5.5) and opens a new high-volume Luna tier at $1/$6; the consumer $20 subscription is untouched, and the family launched gated to a preview list."], "net_read": "Still expansionary; no trigger. Efficiency and pricing claims arrived from several directions, each real and each narrower than its headline, set against one motive-neutral demand-side crack: Meta's admission of excess capacity.", "watching": ["The first down-revision in hyperscaler capex guidance (the core signal).", "Delivered evidence of the Rubin gain or a lab custom inference chip reaching production.", "A Western datacentre permit denied on water grounds, or a Glen Canyon power-pool breach.", "Further hyperscaler admissions of excess capacity, or continued neocloud repricing.", "Whether any actual rate cut to an existing OpenAI tier lands, as opposed to the added-tier pattern."]}, {"n": 5, "week": "Week of 15 July 2026", "pub": "19 July 2026", "doi": "10.5281/zenodo.21435839", "status": "EXPANSIONARY", "trigger": false, "thread": "Does rising token spend convert into proportionate output? The delivered-value gap now carries evidence on both sides; neither the vendor panic nor the boosterism closes it, and the aggregate bill rises regardless of how the per-task question resolves.", "developments": ["The Big Four's 2026 capex guides still sum to roughly $725B (up ~77% on 2025). TSMC posted a record Q2 and raised its own 2026 capex to $60-64B on 16 July, a supplier signal one layer up the chain, not the hyperscaler down-revision the series tracks.", "The Silicon Data token-expenditure index (SDLLMTK, Bloomberg) rose into a mid-May peak as users traded up into frontier models, then fell ~20% as they rotated toward cheaper and open-weight ones, and has since stagnated.", "The frontier-to-floor spread widened to roughly 446-fold: from DeepSeek V4 at ~$0.28 per million output tokens to Claude Mythos 5 at ~$125. Moonshot's Kimi K3 (16 July) matches Claude Opus 4.8 on the Intelligence Index at $3 per million input tokens, with open weights.", "Allianz flags the gap between AI investment and AI-related sales at ~46%, wider than the ~32% gap at the 2001 telecom peak; hyperscaler capex runs at ~45-57% of revenue and exceeds internal cash, pushing the build onto the debt markets.", "The motive-neutral output anchor is a METR randomised trial: experienced developers were ~19% slower with early-2025 AI, forecasting a 24% speed-up (a ~39-point perception gap). A February 2026 update estimated the same developers ~18% faster a year on: the effect is learning-gated and badly mis-perceived, not a fixed tax.", "The primary, motive-neutral anchor: a Federal Reserve (Atlanta/Richmond) and Duke paper (NBER w34984, ~750 executives) measured 2025 AI labour-productivity gains at ~0.4% in low-skill services and ~0.8% in high-skill services and finance: real, positive, small, and slower than the spend.", "Vendor-churn evidence points the same way but sits at motive-tier 5 (each firm sells the tooling that finds the rework): Entelligence's $0.18-reaches-production split, Faros churn +861% with genuine throughput gains alongside. Directional, not settled magnitudes.", "Aggregate bill rises regardless: Gartner puts 2026 worldwide IT spending at ~$6.31T (+13.5%), Goldman projects ~24x token consumption by 2030 (Jevons). IBM's worst day on record (14 July, -25%) shows AI hardware spend crowding out software and consulting budgets."], "net_read": "Still expansionary; no trigger, and days from the first window in which the signal could turn. The output question resolves to 'real but learning-gated and mis-measured' rather than either the wasted-dollar or the tenfold-productivity headline; the aggregate bill grows either way.", "watching": ["The first down-revision in hyperscaler capex guidance at the Q2 reports (Alphabet 22 Jul, Microsoft and Meta 29 Jul, Amazon 30 Jul).", "Whether the SDLLMTK expenditure index resumes its rotation down toward open weights or turns back up.", "Whether the output-conversion gap narrows in independent (non-vendor) measurement as tools are learned.", "Whether supplier capex signals (the TSMC pattern) harden into hyperscaler-guidance cuts.", "Whether AI spend proves additive to IT budgets or crowds them out (the IBM channel)."]}, {"n": 6, "week": "Week of 29 July 2026", "pub": "30 July 2026", "doi": "10.5281/zenodo.21695721", "status": "EXPANSIONARY", "trigger": false, "thread": "The signal was testable for the first time and did not fire. What moved instead was the market's willingness to fund a raise: the same direction of spend drew opposite reactions on the same evening, sorted on whether contracted demand covers it.", "developments": ["The pre-registered trigger, a demand-led down-revision in hyperscaler capex guidance, did not fire in the first quarter it could be tested. Alphabet raised its 2026 guide to $195-205B, Meta narrowed upward to $130-145B, and Microsoft held its calendar-2026 plan.", "Microsoft and Meta reported the same evening, 29 July, which strips out the day's macro and leaves the cross-section. Microsoft rose about 7% after hours; Meta fell 9.64%.", "Microsoft's coverage evidence: revenue $90.01B against $87.62B expected, Azure +43% in the quarter and past $100B across the fiscal year (+41% on that basis), next-quarter growth guided near 45% in constant currency, and a backlog above twice the year's $331.84B of revenue. Its own free cash flow fell 23% to $19.64B.", "Meta's compression evidence: revenue beat at $60.8B, EPS of $6.18 missed a ~$7.17 consensus, operating margin fell to 31% from 43%, and free cash flow was $784M as $31.86B of operating cash flow was consumed by $31.08B of capital expenditure including principal payments on finance leases.", "Microsoft's headline capex fell to roughly $175B from the ~$190B expected. The move is a reclassification of future data-centre leases from finance to operating, which sit outside capex, and not a spending cut.", "The FY2026 Form 10-K does not contain the 25-year useful life reported from the earnings call: it states buildings at five to 15 years and servers at two to six, with no change-in-accounting-estimate disclosure. The extension is forward guidance about a period not yet reported.", "Microsoft's filed contractual obligations total $743.8B: leases including imputed interest $443.5B (only $32.4B due in FY2027), purchase commitments $194.1B and construction commitments $34.6B, against $46.1B of long-term debt principal.", "Alphabet's 10-Q records no repurchases of Class A or Class C shares in either the three or six months to 30 June 2026, leaving $69.5B of a $70.0B authorisation unused, alongside $811.0B of purchase commitments and a $513.9B Google Cloud revenue backlog.", "A correction the series owes: Issue 5 placed Meta at the self-funded end of the financing gradient. Its $784M of free cash flow, the $14B El Paso campus with BlackRock funds taking 80%, and the CFO signalling more debt and partnerships withdraw that placement."], "net_read": "No trigger, and a sharper question in its place. The market now discriminates between raises identical on the number by whether contracted demand covers them. The financing gradient is not a fixed sort of firms but a ladder they descend as the bill outruns internal cash, and Meta moved down a rung in a week.", "watching": ["The first demand-led down-revision in hyperscaler capex guidance, unchanged as the core signal and still not fired.", "Coverage as a second tracked quantity: backlog-to-revenue, cloud growth rates and free cash flow after property and equipment.", "Lease and useful-life accounting as a confound on the capex line: whether the FY2027 10-K carries the change-in-estimate disclosure absent from FY2026.", "The committed forward obligation stack rather than the annual guide, which no capex guidance figure captures.", "Amazon and Apple (30 July) and Nvidia (late August), to close the Q2 window."]}], "indicators": [{"name": "Core signal: capex-guidance down-revision", "unit": "trigger state", "note": "The one thing this series watches. A down-revision in the Big Four's forward capex guide is the trigger.", "readings": [{"issue": 1, "value": "no trigger", "note": "guidance not turned"}, {"issue": 2, "value": "no trigger", "note": "cannot fire before Q2"}, {"issue": 3, "value": "no trigger", "note": "cannot fire before Q2"}, {"issue": 4, "value": "no trigger", "note": "$80B Azure backlog unfilled"}, {"issue": 5, "value": "no trigger", "note": "days from the Q2 window"}, {"issue": 6, "value": "no trigger", "note": "first testable quarter; none of the four conceded a demand-led cut"}]}, {"name": "Big Four 2026 capex guide", "unit": "USD", "note": "Combined forward capital-expenditure guidance, the level the trigger watches for a down-revision.", "readings": [{"issue": 1, "value": "~$660-725B", "note": "utility-grade intensity"}, {"issue": 4, "value": "~$725B", "note": "up ~77% on 2025"}, {"issue": 5, "value": "~$725B", "note": "up ~77%; TSMC raised to $60-64B"}, {"issue": 6, "value": "~$725B into the window", "note": "up ~77% on ~$410B in 2025; Alphabet raised to $195-205B from $180-190B, Meta narrowed upward to $130-145B, Microsoft's stated calendar-2026 expectation fell to ~$175B from the ~$190B expected on a finance-to-operating lease reclassification, plan unchanged"}]}, {"name": "Hyperscaler capex intensity", "unit": "% of revenue", "note": "Capital expenditure as a share of revenue, the reading behind 'utility-grade intensity on software-grade balance sheets'.", "readings": [{"issue": 1, "value": "~46-54%", "note": "Meta ~54%, MSFT ~47%, Alphabet ~46%"}, {"issue": 5, "value": "~45-57%", "note": "exceeds internal cash, onto debt markets"}]}, {"name": "Cheapest open-weight inference floor", "unit": "USD / million output tokens", "note": "The open-weight price floor that frontier list prices are measured against.", "readings": [{"issue": 1, "value": "$0.87", "note": "DeepSeek V4, 75% cut made permanent"}, {"issue": 3, "value": "$0.28", "note": "DeepSeek V4-Flash"}, {"issue": 5, "value": "~$0.28", "note": "DeepSeek V4, floor of a 446x spread"}]}, {"name": "Frontier-to-floor price spread", "unit": "multiple", "note": "The ratio between the most expensive frontier model and the open-weight floor. A widening spread is the backdrop to model-routing.", "readings": [{"issue": 1, "value": "~17-34x", "note": "DeepSeek vs Opus 4.7 / GPT-5.5"}, {"issue": 3, "value": "~25x", "note": "across tiers"}, {"issue": 4, "value": "~100x", "note": "~$10 top to free self-host"}, {"issue": 5, "value": "~446x", "note": "$0.28 to Claude Mythos 5 ~$125"}]}, {"name": "Memory share of hyperscaler capex", "unit": "% of capex", "note": "DRAM/HBM as a share of hyperscaler capital expenditure (SemiAnalysis); the constraint's migration from logic to memory.", "readings": [{"issue": 1, "value": "~30%", "note": "up from ~8% in 2023"}, {"issue": 3, "value": "~30%", "note": "HBM sold out for 2026"}]}, {"name": "Token-expenditure index (aggregate)", "unit": "usage-weighted spend", "note": "What the market actually pays per million tokens across all models, moving with the mix in use rather than list prices.", "readings": [{"issue": 3, "value": "~2x since late 2025", "note": "even as per-token price fell ~90% since 2023 (Jevons)"}, {"issue": 5, "value": "-20% off May peak", "note": "SDLLMTK; rotation to open weights, then stagnation"}]}, {"name": "AI investment-vs-sales gap", "unit": "% gap", "note": "The gap between AI investment and AI-related sales (Allianz), a spend-ahead-of-revenue reading.", "readings": [{"issue": 5, "value": "~46%", "note": "wider than the ~32% at the 2001 telecom peak"}]}, {"name": "FinOps / cost-overrun signal", "unit": "% of enterprises", "note": "How widely AI spend has become a managed cost problem, and how often it overruns.", "readings": [{"issue": 3, "value": "98% manage AI spend", "note": "up from 31% in 2025; 73% overran projections"}]}, {"name": "Announced-vs-delivered power (PJM)", "unit": "GW accepted / submitted", "note": "The grid operator's own deflation of the datacentre load pipeline, the realized-completion method the sister work is built on.", "readings": [{"issue": 2, "value": "34 of ~60 GW", "note": "2030 submissions, a 43% haircut; summer-2027 peak cut ~4 GW"}, {"issue": 4, "value": "38 of ~60 GW", "note": "accepted before construction; ~half firm; ~20-22% energized rate"}]}, {"name": "Coverage of the spend by contracted demand", "unit": "backlog and free cash flow", "note": "Added in issue 6 as the series' second tracked quantity, because guidance direction has pointed up for enough consecutive quarters to have stopped discriminating. Read as backlog-to-revenue and free cash flow after property and equipment, both filings quantities, rather than as a price reaction.", "readings": [{"issue": 6, "value": "MSFT backlog >2x revenue vs META FCF $784m", "note": "Reported the same evening, 29 July, which strips out the day's macro. Microsoft: commercial backlog more than twice the year's $331.84B revenue, Azure past $100B and up 41% on the year, though its own free cash flow fell 23% to $19.64B. Meta: $31.86B of operating cash flow almost entirely consumed by $31.08B of capex. Microsoft rose about 7% after hours, Meta fell 9.64%."}]}]};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const doiUrl = d => 'https://doi.org/' + String(d).replace(/^10\.5281\/zenodo\./i,'10.5281/zenodo.');

// header
$('#sub').textContent = DATA.series.subtitle;
$('#stamp').innerHTML = 'Series concept DOI (always resolves to the latest issue): '
  + '<a href="' + doiUrl(DATA.series.concept_doi) + '" target="_blank" rel="noopener">'
  + esc(DATA.series.concept_doi) + '</a> &middot; ' + esc(DATA.series.author)
  + ' &middot; ORCID <a href="https://orcid.org/' + esc(DATA.series.orcid)
  + '" target="_blank" rel="noopener">' + esc(DATA.series.orcid) + '</a> &middot; CC BY 4.0'
  + '<br><span style="font-style:italic">AI disclosure: the research is the author's; this text was drafted with AI assistance and reviewed by the author. The model, and the conflict it creates, are named in the Conflict of interest section of the linked issue.</span>';

// signal spine
const anyTrig = DATA.issues.some(i => i.trigger);
$('#sigtxt').textContent = anyTrig ? 'TRIGGER FIRED' : 'Expansion, no trigger';
if (anyTrig){ $('#sigval').style.color = 'var(--bad)'; $('#sigval').querySelector('.dot').style.background = 'var(--bad)'; }
$('#signote').innerHTML = '<b>' + esc(DATA.series.signal_name) + '.</b> ' + esc(DATA.series.signal_note)
  + ' Read across ' + DATA.issues.length + ' issues to date.';

// edition buttons
const eseg = $('#editionseg');
DATA.issues.forEach((it, ix) => {
  const b = document.createElement('button');
  b.textContent = 'Issue ' + it.n;
  b.dataset.ix = ix;
  if (ix === DATA.issues.length - 1) b.classList.add('on');
  b.onclick = () => { eseg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); renderEdition(ix); };
  eseg.appendChild(b);
});

function renderEdition(ix){
  const it = DATA.issues[ix];
  const badge = it.trigger ? '<span class="badge trig">'+esc(it.status)+'</span>'
                           : '<span class="badge exp">'+esc(it.status)+' &middot; no trigger</span>';
  let h = '<div class="card"><div class="head">';
  h += '<h2>Issue ' + it.n + ': ' + esc(it.week) + badge + '</h2>';
  h += '<div class="meta">Published ' + esc(it.pub) + ' &middot; <a href="' + doiUrl(it.doi)
     + '" target="_blank" rel="noopener">' + esc(it.doi) + '</a></div>';
  h += '</div><div class="body">';
  h += '<p class="thread">' + esc(it.thread) + '</p>';
  h += '<div class="subh">What moved</div><ul class="dev">';
  it.developments.forEach(d => h += '<li>' + esc(d) + '</li>');
  h += '</ul>';
  h += '<div class="net"><b>Net read.</b> ' + esc(it.net_read) + '</div>';
  h += '<div class="subh">Indicators watched next</div><ul class="watch">';
  it.watching.forEach(w => h += '<li>' + esc(w) + '</li>');
  h += '</ul></div></div>';
  $('#editionview').innerHTML = h;
}

// indicator select
const isel = $('#indsel');
DATA.indicators.forEach((ind, ix) => {
  const o = document.createElement('option'); o.value = ix; o.textContent = ind.name; isel.appendChild(o);
});
isel.onchange = () => renderIndicator(+isel.value);

function issueMeta(n){ return DATA.issues.find(i => i.n === n) || {}; }
function renderIndicator(ix){
  const ind = DATA.indicators[ix];
  let h = '<div class="card"><div class="head"><h2>' + esc(ind.name) + '</h2>';
  h += '<div class="meta">' + esc(ind.unit) + '</div></div><div class="body">';
  h += '<p class="thread">' + esc(ind.note) + '</p>';
  h += '<table><thead><tr><th>Edition</th><th>Reading</th><th>Detail</th></tr></thead><tbody>';
  ind.readings.forEach(r => {
    const m = issueMeta(r.issue);
    h += '<tr><td class="iss">Issue ' + r.issue + '<br><span style="font-size:11px">' + esc(m.week||'') + '</span></td>'
       + '<td class="val">' + esc(r.value) + '</td>'
       + '<td>' + esc(r.note||'') + '</td></tr>';
  });
  h += '</tbody></table>';
  const seen = ind.readings.map(r=>r.issue);
  const missing = DATA.issues.map(i=>i.n).filter(n=>!seen.includes(n));
  if (missing.length) h += '<p style="font-size:12px;color:var(--slate);margin-top:10px">Not separately logged in issue'
    + (missing.length>1?'s ':' ') + missing.join(', ') + '.</p>';
  h += '</div></div>';
  $('#indicatorview').innerHTML = h;
}

// view toggle
$('#viewseg').querySelectorAll('button').forEach(b => {
  b.onclick = () => {
    $('#viewseg').querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    const ed = b.dataset.v === 'edition';
    $('#editionview').classList.toggle('hide', !ed);
    $('#indicatorview').classList.toggle('hide', ed);
    $('#editionctl').classList.toggle('hide', !ed);
    $('#indicatorctl').classList.toggle('hide', ed);
  };
});

$('#foot').innerHTML = '<b>Method.</b> Each edition is a frozen, dated note; every figure is sourced in the '
  + 'linked paper and stated at its true tier (vendor claims labelled by the seller\'s business model, not treated as findings). '
  + 'This front-end embeds the frozen dataset verbatim and is regenerated by <code>build.py</code>; the citable record is the Zenodo DOI per issue, '
  + 'and the series concept DOI above always resolves to the latest. '
  + '<br><b>Conflict of interest.</b> The series is produced with assistance from an Anthropic model, and Anthropic is among the companies it tracks '
  + '(Claude pricing, run-rate revenue, the S-1, the Fable/Mythos suspension, custom-chip talks). Any reading that touches Anthropic is non-neutral; '
  + 'primary and vendor-independent sources are preferred. This is independent analysis, not investment advice.';

// initial paint
renderEdition(DATA.issues.length - 1);
renderIndicator(0);
</script>
<script>(function(){
  var b=document.createElement('button');b.className='themebtn';
  function lbl(){b.textContent=(document.documentElement.getAttribute('data-theme')==='dark')?'\u25D1 LIGHT':'\u25D1 DARK';}
  b.onclick=function(){var d=document.documentElement.getAttribute('data-theme')==='dark';
    var n=d?'light':'dark';document.documentElement.setAttribute('data-theme',n);
    try{localStorage.setItem('nmai-theme',n);}catch(e){}lbl();};
  lbl();document.body.appendChild(b);
})();</script>
</body>
</html>
